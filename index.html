<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <title>SkyGame: Helibike 3D - Intervalos & Sprints</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- UI & Cockpit HUD Overlay -->
  <div id="ui-overlay">
    <!-- Top Control Bar (Balanced 3-column layout) -->
    <header class="top-bar">
      <!-- Top Left: Distance, Calories & Altitude -->
      <div class="top-left-stats">
        <div class="stat-chip">
          <span class="label">Distância</span>
          <span class="value" id="val-distance">0.00 km</span>
        </div>
        <div class="stat-chip">
          <span class="label">Calorias</span>
          <span class="value" id="val-calories">0 kcal</span>
        </div>
        <div class="altimeter-panel">
          <div class="altitude-meter-bar">
            <div class="altitude-fill" id="altitude-fill"></div>
          </div>
          <div class="alt-info">
            <span class="val" id="val-altitude">36</span>
            <span class="unit">ALTURA (M)</span>
          </div>
        </div>
      </div>

      <!-- Top Center: Workout Interval Banner & Quick Action Buttons -->
      <div class="top-center-group">
        <div class="workout-center-banner" id="workout-banner">
          <span class="workout-phase-title" id="workout-phase-title">AQUECIMENTO</span>
          <div class="workout-timer-row">
            <span class="workout-time-remaining" id="workout-timer">3:00</span>
            <span class="workout-target-pill" id="workout-target-rpm">META: 55 RPM</span>
          </div>
          <span class="workout-status-badge" id="workout-status-badge">RITMO INICIAL</span>
        </div>

        <!-- Action Pills Bar neatly centered under workout banner -->
        <div class="connection-buttons">
          <div class="difficulty-select-wrap">
            <select id="select-difficulty" title="Dificuldade do treino">
              <option value="facil">Fácil (+10)</option>
              <option value="normal" selected>Normal (+15)</option>
              <option value="dificil">Difícil (+20)</option>
            </select>
          </div>
          <button id="btn-ranking" class="btn-pill rank" title="Ver classificação">
            <span>🏆</span> Ranking
          </button>
          <button id="btn-connect-bike" class="btn-pill" title="Ligar à bicicleta FTMS">
            <span>🚲</span> Ligar Bike
          </button>
          <button id="btn-connect-hr" class="btn-pill heart" title="Ligar ao Smartwatch">
            <span>❤️</span> Relógio
          </button>
          <button id="btn-toggle-sim" class="btn-pill" title="Ativar modo de teste">
            <span>🎮</span> Sim
          </button>
        </div>
      </div>

      <!-- Top Right: Score & Multiplier (Always visible!) -->
      <div class="top-right-score">
        <span class="score-num" id="val-score">0</span>
        <span class="combo-tag" id="val-combo">COMBO 1x</span>
      </div>
    </header>

    <!-- Status Toast Notification -->
    <div id="status-toast">A aguardar ligação...</div>

    <!-- Bottom Cockpit Dashboard -->
    <footer class="bottom-cockpit">
      <div class="gauge-card">
        <span class="title">Velocidade</span>
        <span class="big-val" id="val-speed">0</span>
        <span class="title">KM / H</span>
      </div>

      <div class="gauge-card cadence-card" id="cadence-card">
        <span class="title">Cadência (Pedal)</span>
        <span class="big-val" id="val-cadence">0</span>
        <span class="title">RPM</span>
      </div>

      <div class="gauge-card">
        <span class="title">Cardíaco</span>
        <div class="hr-val-group">
          <span class="heart-icon">♥</span>
          <span class="big-val" id="val-bpm">--</span>
        </div>
        <span class="zone-badge" id="val-zone">DESLIGADO</span>
      </div>
    </footer>

    <!-- Manual Simulation Controls -->
    <div id="sim-drawer">
      <span style="font-size: 11px; font-weight: 700;">Simular RPM:</span>
      <input type="range" id="sim-rpm-slider" min="0" max="140" value="60">
      <span id="sim-rpm-display" style="font-size: 12px; font-weight: 800; min-width: 45px;">60 RPM</span>
    </div>
  </div>

  <!-- Ranking / Leaderboard Modal -->
  <div class="modal-backdrop" id="ranking-modal">
    <div class="ranking-card">
      <div class="ranking-header">
        <h2>🏆 Ranking dos Melhores Pilotos</h2>
        <button class="btn-close-modal" id="btn-close-ranking">✕</button>
      </div>

      <div class="save-score-section" id="save-score-section">
        <input type="text" id="input-player-name" placeholder="O teu nome / apelido" maxlength="15">
        <button class="btn-save-score" id="btn-save-score">Gravar Pontuação</button>
      </div>

      <div class="ranking-table-container">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Piloto</th>
              <th>Pontos</th>
              <th>Nível</th>
              <th>RPM Máx</th>
              <th>Calorias</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="ranking-table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>

      <button class="btn-close-modal" id="btn-close-ranking-bottom">Voltar ao Jogo</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
